app = 'astrid-downloader-api'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'astrid_storage'
  destination = '/app/storage'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1