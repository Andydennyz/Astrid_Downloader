services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      FRONTEND_URL: http://localhost:5175
      STORAGE_PATH: /app/storage
    expose:
      - "8000"
    secrets:
      - backend_env
    volumes:
      - ./data:/app/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_API_BASE_URL: /api/v1
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "5175:5174"
    restart: unless-stopped

secrets:
  backend_env:
    file: ./backend/docker.env
